    grammar:
      title: "Твой, его, её"
      explain:
        - "С друзьями и детьми говорят на «ты»: [[du]]. «Твой» по-немецки — [[dein]], «твоя» — [[deine]]: [[dein Bruder]], [[deine Schwester]]."
        - "«Его» — [[sein]]: [[sein Vater]], [[seine Mutter]]. Так говорят о мужчине: [[Peter und seine Frau]] — «Петер и его жена»."
        - "«Её» — [[ihr]]: [[ihr Sohn]], [[ihre Tochter]]. Так говорят о женщине: [[Anna und ihre Familie]]."
        - "Правило то же, что у [[mein]] и [[meine]]: с женским родом и во множественном числе добавляется звук «э»: [[deine]], [[seine]], [[ihre]]."
        - "Не путайте: [[ihr]] с маленькой буквы — «её», а [[Ihr]] с большой буквы — вежливое «ваш». На слух их различают по смыслу."
      exercises:
        - q: "Как сказать «его сестра»?"
          options: ["[[seine Schwester]]", "[[sein Schwester]]", "[[ihre Schwester]]", "[[deine Schwester]]", "[[seinen Schwester]]"]
        - q: "Как сказать «её муж»?"
          options: ["[[ihr Mann]]", "[[ihre Mann]]", "[[sein Mann]]", "[[ihren Mann]]", "[[mein Mann]]"]
        - q: "Как сказать другу «твой подарок»?"
          options: ["[[dein Geschenk]]", "[[deine Geschenk]]", "[[Ihr Geschenk]]", "[[sein Geschenk]]", "[[deinen Geschenk]]"]
        - q: "Анна рассказывает о своих родителях. Как сказать «её родители»?"
          options: ["[[ihre Eltern]]", "[[ihr Eltern]]", "[[seine Eltern]]", "[[deine Eltern]]", "[[meine Eltern]]"]
        - q: "Что значит [[Thomas und seine Frau]]?"
          options: ["Томас и его жена", "Томас и её жена", "Томас и твоя жена", "Томас и ваша жена"]
    dialogue:
