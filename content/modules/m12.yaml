    phrases:
      - de: "Viele Grüße!"
        ru: "С приветом!"
      - de: "Herzliche Grüße!"
        ru: "Сердечный привет!"
      - de: "Ich möchte ein Paket schicken."
        ru: "Я хотел бы отправить посылку."
      - de: "Was kostet ein Brief nach Russland?"
        ru: "Сколько стоит письмо в Россию?"
    grammar:
      title: "Обзор модальных глаголов"
      explain:
        - "Модальные глаголы говорят, как мы относимся к действию: можем, должны, хотим. Второй глагол стоит в конце в начальной форме: [[Ich kann gut schwimmen.]]"
        - "[[Können]] — мочь, уметь: [[Ich kann Deutsch sprechen.]] [[Müssen]] — быть должным: [[Ich muss arbeiten.]] [[Wollen]] — хотеть: [[Ich will nach Berlin fahren.]]"
        - "[[Dürfen]] — можно, разрешено: [[Hier darf man nicht rauchen.]] [[Sollen]] — следует, когда кто-то советует или велит: [[Der Arzt sagt, ich soll viel schlafen.]]"
        - "[[Möchten]] — вежливое «хотел бы»: [[Ich möchte ein Paket schicken.]] Это вежливее, чем [[ich will]]."
        - "Важно: у [[ich]] и [[er]] нет окончания: [[ich kann]], [[er kann]]; [[ich muss]], [[er muss]]; [[ich will]], [[er will]]."
      exercises:
        - q: "Как сказать «Я должен заполнить бланк»?"
          options: ["[[Ich muss das Formular ausfüllen.]]", "[[Ich muss ausfüllen das Formular.]]", "[[Ich muss das Formular aus.]]", "[[Ich müsse das Formular ausfüllen.]]", "[[Ich muss das Formular füllt aus.]]"]
        - q: "Какой глагол значит «можно, разрешено»?"
          options: ["[[dürfen]]", "[[müssen]]", "[[wollen]]", "[[sollen]]", "[[möchten]]"]
        - q: "Какая форма нужна: [[Er ... gut schwimmen.]]"
          options: ["[[kann]]", "[[kannt]]", "[[können]]", "[[kannst]]", "[[könnt]]"]
        - q: "Как вежливо сказать «Я хотел бы отправить письмо»?"
          options: ["[[Ich möchte einen Brief schicken.]]", "[[Ich möchte schicken einen Brief.]]", "[[Ich möchte einen Brief schicke.]]", "[[Ich möchten einen Brief schicken.]]", "[[Möchte ich einen Brief schicken.]]"]
        - q: "Что значит [[Hier darf man nicht rauchen.]]?"
          options: ["Здесь нельзя курить.", "Здесь нужно курить.", "Здесь хотят курить.", "Здесь все курят.", "Здесь можно курить."]
        - q: "Как сказать «Врач говорит, что мне следует больше гулять»?"
          options: ["[[Der Arzt sagt, ich soll mehr spazieren gehen.]]", "[[Der Arzt sagt, ich darf mehr spazieren gehen.]]", "[[Der Arzt sagt, ich soll mehr spazieren gehe.]]", "[[Der Arzt sagt, ich sollen mehr spazieren gehen.]]"]
    dialogue:
      title: "На почте после отпуска"
      speakers: {A: f, B: m}
      lines:
        - [A, "Guten Tag! Ich möchte ein Paket nach Russland schicken.", "Добрый день! Я хотела бы отправить посылку в Россию."]
        - [B, "Gern. Dann müssen Sie dieses Formular ausfüllen.", "Хорошо. Тогда вам нужно заполнить этот бланк."]
        - [A, "Kann ich das auch auf Englisch schreiben?", "Можно написать это и по-английски?"]
        - [B, "Ja, das dürfen Sie. Was ist im Paket?", "Да, можно. Что в посылке?"]
        - [A, "Geschenke für meine Familie. Ich war zwei Wochen in Österreich.", "Подарки для моей семьи. Я две недели была в Австрии."]
        - [B, "Schön! Wie war das Wetter?", "Здорово! Какая была погода?"]
        - [A, "Sehr gut. Es war warm und die Sonne hat jeden Tag geschienen.", "Очень хорошая. Было тепло, и каждый день светило солнце."]
        - [B, "Und was haben Sie gemacht?", "А что вы делали?"]
        - [A, "Wir sind in die Berge gefahren und haben viel gesehen.", "Мы ездили в горы и многое посмотрели."]
        - [B, "Toll. So, das Paket kostet fünfundzwanzig Euro.", "Отлично. Итак, посылка стоит двадцать пять евро."]
        - [A, "Und ich brauche noch drei Briefmarken für Postkarten.", "И мне ещё нужны три марки для открыток."]
        - [B, "Nach Russland? Das sind zusammen sechs Euro dreißig.", "В Россию? Это вместе шесть евро тридцать."]
        - [A, "Kann ich mit Karte bezahlen?", "Можно заплатить картой?"]
        - [B, "Ja, natürlich. Vielen Dank und einen schönen Tag!", "Да, конечно. Большое спасибо и хорошего дня!"]
      questions:
        - q: "Куда женщина отправляет посылку?"
          options: ["В Россию", "В Австрию", "В Германию", "В Швейцарию"]
        - q: "Что в посылке?"
          options: ["Подарки для семьи", "Книги", "Одежда для отпуска", "Письма и открытки"]
        - q: "Сколько стоит посылка?"
          options: ["Двадцать пять евро", "Шесть евро тридцать", "Пятнадцать евро", "Тридцать пять евро"]
