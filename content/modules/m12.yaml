  - id: m12l05
    title: "Большое повторение"
    intro: "В этом уроке вы выучите несколько слов о почте и повторите модальные глаголы. А в конце вас ждёт длинный диалог."
    words:
      - de: "die Postkarte"
        ru: "открытка"
        plural: "die Postkarten"
        ex: "Ich schreibe eine Postkarte aus Wien."
        exRu: "Я пишу открытку из Вены."
