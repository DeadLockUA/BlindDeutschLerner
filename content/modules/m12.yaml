        - q: "Какое слово пропущено: [[Ich habe ... Portemonnaie verloren.]]"
          options: ["[[mein]]", "[[meinen]]", "[[meine]]", "[[meiner]]", "[[meinem]]"]
        - q: "Как спросить «Вы нашли сумку?»"
          options: ["[[Haben Sie die Tasche gefunden?]]", "[[Sind Sie die Tasche gefunden?]]", "[[Haben Sie gefunden die Tasche?]]", "[[Sie haben die Tasche finden?]]", "[[Haben die Tasche Sie gefunden?]]"]
        - q: "Что значит [[Der Automat funktioniert nicht.]]?"
          options: ["Автомат не работает.", "Автомат работает.", "Автомат далеко.", "Автомат новый.", "Автомата нет."]
