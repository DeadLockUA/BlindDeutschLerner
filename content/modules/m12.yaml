        - "Когда что-то случилось, мы рассказываем об этом в перфекте: [[haben]] на втором месте и причастие в конце."
        - "Глагол [[verlieren]] — терять. Причастие — [[verloren]], без приставки [[ge]]: [[Ich habe meinen Pass verloren.]] — Я потерял паспорт."
        - "Глагол [[finden]] — находить. Причастие — [[gefunden]]: [[Ich habe meine Tasche gefunden.]] — Я нашёл сумку."
        - "Обратите внимание на артикль мужского рода: [[der Pass]], но [[Ich habe meinen Pass verloren.]] Это винительный падеж, как в [[Ich habe einen Koffer.]]"
        - "Вопрос: [[Haben Sie Ihren Schlüssel gefunden?]] — Вы нашли свой ключ? Ответ: [[Ja, ich habe ihn gefunden.]] или [[Nein, leider nicht.]]"
