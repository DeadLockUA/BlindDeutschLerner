id: m12
title: "Путешествия"
lessons:
  - id: m12l01
    title: "Отпуск"
    intro: "В этом уроке вы научитесь говорить об отпуске, поездках и перелётах."
    words:
      - de: "der Urlaub"
        ru: "отпуск"
        plural: "die Urlaube"
        ex: "Im August habe ich Urlaub."
        exRu: "В августе у меня отпуск."
      - de: "die Reise"
        ru: "поездка, путешествие"
        plural: "die Reisen"
        ex: "Die Reise war sehr schön."
        exRu: "Поездка была очень хорошей."
      - de: "reisen"
        ru: "путешествовать"
        ex: "Ich reise gern."
        exRu: "Я люблю путешествовать."
      - de: "der Koffer"
        ru: "чемодан"
        plural: "die Koffer"
        ex: "Mein Koffer ist schwer."
        exRu: "Мой чемодан тяжёлый."
      - de: "packen"
        ru: "собирать вещи"
        ex: "Heute Abend packe ich den Koffer."
        exRu: "Сегодня вечером я собираю чемодан."
      - de: "der Pass"
        ru: "паспорт"
        plural: "die Pässe"
        ex: "Haben Sie Ihren Pass?"
        exRu: "У вас есть паспорт?"
      - de: "das Ausland"
        ru: "заграница"
        ex: "Wir fahren ins Ausland."
        exRu: "Мы едем за границу."
      - de: "das Flugzeug"
        ru: "самолёт"
        plural: "die Flugzeuge"
        ex: "Das Flugzeug ist pünktlich."
        exRu: "Самолёт прилетает вовремя."
      - de: "der Flughafen"
        ru: "аэропорт"
        plural: "die Flughäfen"
        ex: "Der Flughafen ist weit."
        exRu: "Аэропорт далеко."
      - de: "fliegen"
        ru: "лететь"
        ex: "Morgen fliege ich nach Wien."
        exRu: "Завтра я лечу в Вену."
      - de: "die Sehenswürdigkeit"
        ru: "достопримечательность"
        plural: "die Sehenswürdigkeiten"
        ex: "Berlin hat viele Sehenswürdigkeiten."
        exRu: "В Берлине много достопримечательностей."
      - de: "der Tourist"
        ru: "турист"
        plural: "die Touristen"
        ex: "Im Sommer kommen viele Touristen."
        exRu: "Летом приезжает много туристов."
      - de: "die Ferien"
        ru: "каникулы"
        ex: "Die Kinder haben Ferien."
        exRu: "У детей каникулы."
    phrases:
      - de: "Gute Reise!"
        ru: "Счастливого пути!"
      - de: "Schönen Urlaub!"
        ru: "Хорошего отпуска!"
      - de: "Wohin fahren Sie in Urlaub?"
        ru: "Куда вы едете в отпуск?"
      - de: "Ich mache Urlaub am Meer."
        ru: "Я провожу отпуск на море."
      - de: "Wie lange bleiben Sie?"
        ru: "Как долго вы пробудете?"
      - de: "Ich fahre ins Ausland."
        ru: "Я еду за границу."
    grammar:
      title: "Куда ехать: в город или в страну"
      explain:
        - "Когда мы едем в город или страну, по-немецки обычно говорят [[nach]]: [[nach Berlin]], [[nach Wien]], [[nach Deutschland]], [[nach Italien]], [[nach Russland]]."
        - "Но у некоторых стран есть артикль. Это, например, [[die Schweiz]], [[die Türkei]], [[die Ukraine]], [[die USA]]. С ними говорят [[in die]]: [[in die Schweiz]], [[in die Türkei]], [[in die USA]]."
        - "Сравните: [[Ich fliege nach Spanien.]] — Я лечу в Испанию. [[Ich fliege in die Türkei.]] — Я лечу в Турцию."
        - "А вот «где?» звучит по-другому: [[in Spanien]], [[in Berlin]], но [[in der Schweiz]], [[in der Türkei]]. Например: [[Ich wohne in der Schweiz.]]"
        - "За границу — [[ins Ausland]]. За границей — [[im Ausland]]."
      exercises:
        - q: "Как сказать «Я лечу в Испанию»?"
          options: ["[[Ich fliege nach Spanien.]]", "[[Ich fliege in Spanien.]]", "[[Ich fliege zu Spanien.]]", "[[Ich fliege in die Spanien.]]", "[[Ich fliege nach die Spanien.]]"]
        - q: "Как сказать «Мы едем в Швейцарию»?"
          options: ["[[Wir fahren in die Schweiz.]]", "[[Wir fahren nach Schweiz.]]", "[[Wir fahren nach der Schweiz.]]", "[[Wir fahren in der Schweiz.]]", "[[Wir fahren zu Schweiz.]]"]
        - q: "Какое слово пропущено: [[Morgen fliege ich ... Wien.]]"
          options: ["[[nach]]", "[[in die]]", "[[im]]", "[[zu der]]", "[[aus]]"]
        - q: "Как сказать «Я живу в Турции»?"
          options: ["[[Ich wohne in der Türkei.]]", "[[Ich wohne in die Türkei.]]", "[[Ich wohne nach Türkei.]]", "[[Ich wohne in Türkei.]]", "[[Ich wohne nach der Türkei.]]"]
        - q: "Как сказать «Мы едем за границу»?"
          options: ["[[Wir fahren ins Ausland.]]", "[[Wir fahren im Ausland.]]", "[[Wir fahren nach Ausland.]]", "[[Wir fahren in Ausland.]]"]
    dialogue:
      title: "Скоро отпуск"
      speakers: {A: f, B: m}
      lines:
        - [A, "Herr Weber, wohin fahren Sie in Urlaub?", "Господин Вебер, куда вы едете в отпуск?"]
        - [B, "Ich fliege mit meiner Frau in die Türkei.", "Я лечу с женой в Турцию."]
        - [A, "Toll! Wie lange bleiben Sie?", "Отлично! Как долго вы пробудете?"]
        - [B, "Zwei Wochen. Wir machen Urlaub am Meer. Und Sie?", "Две недели. Мы проводим отпуск на море. А вы?"]
        - [A, "Ich fahre nach Wien. Dort gibt es viele Sehenswürdigkeiten.", "Я еду в Вену. Там много достопримечательностей."]
        - [B, "Fliegen Sie?", "Вы летите самолётом?"]
        - [A, "Nein, ich fahre mit dem Zug.", "Нет, я еду на поезде."]
        - [B, "Dann gute Reise!", "Тогда счастливого пути!"]
      questions:
        - q: "Куда летит господин Вебер?"
          options: ["В Турцию", "В Вену", "В Швейцарию", "В Испанию"]
        - q: "Сколько времени он там пробудет?"
          options: ["Две недели", "Одну неделю", "Три дня", "Месяц"]
        - q: "Как женщина едет в Вену?"
          options: ["На поезде", "На самолёте", "На машине", "На автобусе"]

  - id: m12l02
    title: "В гостинице"
    intro: "В этом уроке вы научитесь снимать номер в гостинице и вежливо о чём-то просить."
    words:
      - de: "das Hotel"
        ru: "гостиница"
        plural: "die Hotels"
        ex: "Das Hotel ist im Zentrum."
        exRu: "Гостиница в центре."
      - de: "das Einzelzimmer"
        ru: "одноместный номер"
        plural: "die Einzelzimmer"
        ex: "Das Einzelzimmer kostet sechzig Euro."
        exRu: "Одноместный номер стоит шестьдесят евро."
      - de: "das Doppelzimmer"
        ru: "двухместный номер"
        plural: "die Doppelzimmer"
        ex: "Wir brauchen ein Doppelzimmer."
        exRu: "Нам нужен двухместный номер."
      - de: "die Rezeption"
        ru: "стойка регистрации"
        plural: "die Rezeptionen"
        ex: "Die Rezeption ist rechts."
        exRu: "Стойка регистрации справа."
      - de: "der Schlüssel"
        ru: "ключ"
        plural: "die Schlüssel"
        ex: "Hier ist Ihr Schlüssel."
        exRu: "Вот ваш ключ."
      - de: "reservieren"
        ru: "бронировать"
        ex: "Ich möchte ein Zimmer reservieren."
        exRu: "Я хотел бы забронировать номер."
      - de: "übernachten"
        ru: "ночевать"
        ex: "Wir übernachten im Hotel."
        exRu: "Мы ночуем в гостинице."
      - de: "die Übernachtung"
        ru: "ночёвка"
        plural: "die Übernachtungen"
        ex: "Eine Übernachtung kostet achtzig Euro."
        exRu: "Одна ночь стоит восемьдесят евро."
      - de: "inklusive"
        ru: "включено"
        ex: "Das Frühstück ist inklusive."
        exRu: "Завтрак включён."
      - de: "frei"
        ru: "свободный"
        ex: "Das Zimmer ist frei."
        exRu: "Номер свободен."
      - de: "besetzt"
        ru: "занятый"
        ex: "Leider ist alles besetzt."
        exRu: "К сожалению, всё занято."
      - de: "die Reservierung"
        ru: "бронь"
        plural: "die Reservierungen"
        ex: "Ich habe eine Reservierung."
        exRu: "У меня есть бронь."
      - de: "das Gepäck"
        ru: "багаж"
        ex: "Wo ist mein Gepäck?"
        exRu: "Где мой багаж?"
      - de: "der Aufzug"
        ru: "лифт"
        plural: "die Aufzüge"
        ex: "Der Aufzug ist links."
        exRu: "Лифт слева."
    phrases:
      - de: "Ich hätte gern ein Einzelzimmer."
        ru: "Я хотел бы одноместный номер."
      - de: "Haben Sie ein Zimmer frei?"
        ru: "У вас есть свободный номер?"
      - de: "Für wie viele Nächte?"
        ru: "На сколько ночей?"
      - de: "Ist das Frühstück inklusive?"
        ru: "Завтрак включён?"
      - de: "Ich habe ein Zimmer reserviert."
        ru: "Я забронировал номер."
      - de: "Könnten Sie mir ein Taxi rufen?"
        ru: "Не могли бы вы вызвать мне такси?"
      - de: "Könnten Sie mich um sieben Uhr wecken?"
        ru: "Не могли бы вы разбудить меня в семь часов?"
    grammar:
      title: "Вежливые просьбы"
      explain:
        - "В гостинице, в кафе и в магазине очень удобны две вежливые формулы. Их можно просто выучить целиком."
        - "Первая: [[Ich hätte gern]] — «я хотел бы», «мне, пожалуйста». После неё идёт то, что вы хотите: [[Ich hätte gern ein Doppelzimmer.]] [[Ich hätte gern einen Kaffee.]]"
        - "[[Ich hätte gern]] звучит так же вежливо, как [[Ich möchte]]. Можно говорить и так, и так."
        - "Вторая: [[Könnten Sie]] — «не могли бы вы». Глагол в начале, а другой глагол — в конце: [[Könnten Sie mir helfen?]] [[Könnten Sie das wiederholen?]]"
        - "Это вежливее, чем [[Können Sie]]. А в конце хорошо добавить [[bitte]]: [[Könnten Sie bitte langsam sprechen?]]"
      exercises:
        - q: "Как вежливо сказать «Мне, пожалуйста, двухместный номер»?"
          options: ["[[Ich hätte gern ein Doppelzimmer.]]", "[[Ich habe gern ein Doppelzimmer.]]", "[[Ich hätte ein Doppelzimmer gern haben.]]", "[[Hätte ich gern ein Doppelzimmer?]]", "[[Ich gern hätte ein Doppelzimmer.]]"]
        - q: "Как спросить «Не могли бы вы мне помочь?»"
          options: ["[[Könnten Sie mir helfen?]]", "[[Könnten Sie helfen mir?]]", "[[Sie könnten mir helfen.]]", "[[Könnten mir Sie helfen?]]", "[[Helfen Sie könnten mir?]]"]
        - q: "Что значит [[Das Frühstück ist inklusive.]]?"
          options: ["Завтрак включён.", "Завтрак не включён.", "Завтрак в семь часов.", "Завтрак стоит дорого.", "Завтрака нет."]
        - q: "Как правильно?"
          options: ["[[Könnten Sie bitte langsam sprechen?]]", "[[Könnten Sie bitte sprechen langsam?]]", "[[Könnten bitte Sie langsam sprechen?]]", "[[Sie könnten bitte sprechen langsam?]]"]
        - q: "Как спросить «У вас есть свободный номер?»"
          options: ["[[Haben Sie ein Zimmer frei?]]", "[[Haben Sie ein Zimmer besetzt?]]", "[[Sind Sie ein Zimmer frei?]]", "[[Haben Sie frei ein Zimmer?]]", "[[Hat Sie ein Zimmer frei?]]"]
    dialogue:
      title: "На ресепшене"
      speakers: {A: m, B: f}
      lines:
        - [A, "Guten Abend! Haben Sie ein Zimmer frei?", "Добрый вечер! У вас есть свободный номер?"]
        - [B, "Guten Abend! Ein Einzelzimmer oder ein Doppelzimmer?", "Добрый вечер! Одноместный или двухместный?"]
        - [A, "Ich hätte gern ein Einzelzimmer.", "Мне, пожалуйста, одноместный номер."]
        - [B, "Für wie viele Nächte?", "На сколько ночей?"]
        - [A, "Für zwei Nächte. Ist das Frühstück inklusive?", "На две ночи. Завтрак включён?"]
        - [B, "Ja. Eine Übernachtung kostet siebzig Euro.", "Да. Одна ночь стоит семьдесят евро."]
        - [A, "Gut. Könnten Sie mich um sieben Uhr wecken?", "Хорошо. Не могли бы вы разбудить меня в семь часов?"]
        - [B, "Natürlich. Hier ist Ihr Schlüssel. Zimmer zwölf. Der Aufzug ist links.", "Конечно. Вот ваш ключ. Номер двенадцать. Лифт слева."]
      questions:
        - q: "Какой номер хочет мужчина?"
          options: ["Одноместный", "Двухместный", "Номер с балконом", "Самый дешёвый"]
        - q: "Сколько стоит одна ночь?"
          options: ["Семьдесят евро", "Семнадцать евро", "Шестьдесят евро", "Сто евро"]
        - q: "Во сколько нужно разбудить мужчину?"
          options: ["В семь часов", "В шесть часов", "В восемь часов", "В двенадцать часов"]

  - id: m12l03
    title: "На вокзале"
    intro: "В этом уроке вы научитесь понимать объявления на вокзале и спрашивать о поездах."
    words:
      - de: "der Bahnhof"
        ru: "вокзал"
        plural: "die Bahnhöfe"
        ex: "Der Bahnhof ist nicht weit."
        exRu: "Вокзал недалеко."
      - de: "der Hauptbahnhof"
        ru: "главный вокзал"
        plural: "die Hauptbahnhöfe"
        ex: "Der Zug fährt zum Hauptbahnhof."
        exRu: "Поезд едет на главный вокзал."
      - de: "der Bahnsteig"
        ru: "платформа"
        plural: "die Bahnsteige"
        ex: "Wir warten auf dem Bahnsteig."
        exRu: "Мы ждём на платформе."
      - de: "die Verspätung"
        ru: "опоздание"
        plural: "die Verspätungen"
        ex: "Der Zug hat Verspätung."
        exRu: "Поезд опаздывает."
      - de: "pünktlich"
        ru: "вовремя"
        ex: "Der Bus kommt pünktlich."
        exRu: "Автобус приходит вовремя."
      - de: "ankommen"
        ru: "прибывать"
        ex: "Der Zug kommt um acht Uhr an."
        exRu: "Поезд прибывает в восемь часов."
      - de: "abfahren"
        ru: "отправляться"
        ex: "Der Bus fährt gleich ab."
        exRu: "Автобус сейчас отправляется."
      - de: "der Schalter"
        ru: "касса, окошко"
        plural: "die Schalter"
        ex: "Der Schalter ist geschlossen."
        exRu: "Касса закрыта."
      - de: "die Information"
        ru: "справочная"
        plural: "die Informationen"
        ex: "Fragen Sie bitte an der Information."
        exRu: "Спросите, пожалуйста, в справочной."
      - de: "die Durchsage"
        ru: "объявление"
        plural: "die Durchsagen"
        ex: "Hören Sie die Durchsage?"
        exRu: "Вы слышите объявление?"
      - de: "der Wagen"
        ru: "вагон"
        plural: "die Wagen"
        ex: "Mein Platz ist in Wagen fünf."
        exRu: "Моё место в пятом вагоне."
      - de: "der Anschluss"
        ru: "пересадка, стыковка"
        plural: "die Anschlüsse"
        ex: "Ich habe meinen Anschluss verpasst."
        exRu: "Я опоздал на пересадку."
      - de: "der Sitzplatz"
        ru: "сидячее место"
        plural: "die Sitzplätze"
        ex: "Ich möchte einen Sitzplatz reservieren."
        exRu: "Я хотел бы забронировать место."
    phrases:
      - de: "Der Zug hat zehn Minuten Verspätung."
        ru: "Поезд опаздывает на десять минут."
      - de: "Wann kommt der Zug in Berlin an?"
        ru: "Когда поезд прибывает в Берлин?"
      - de: "Von welchem Gleis fährt der Zug ab?"
        ru: "С какого пути отправляется поезд?"
      - de: "Der Zug fällt aus."
        ru: "Поезд отменён."
      - de: "Bitte einsteigen!"
        ru: "Пожалуйста, садитесь в поезд!"
      - de: "Achtung an Gleis drei!"
        ru: "Внимание, третий путь!"
    grammar:
      title: "Отделяемые глаголы: прибывать и отправляться"
      explain:
        - "Глаголы [[ankommen]] и [[abfahren]] отделяемые. Приставка [[an]] или [[ab]] уходит в конец предложения."
        - "[[Der Zug kommt an.]] — Поезд прибывает. [[Der Zug fährt ab.]] — Поезд отправляется."
        - "Время обычно стоит в середине: [[Der Zug kommt um zehn Uhr an.]] [[Der Bus fährt um acht Uhr ab.]]"
        - "Если начать со времени, глагол всё равно на втором месте, а приставка в конце: [[Um zehn Uhr kommt der Zug an.]]"
        - "В вопросе так же: [[Wann fährt der Zug ab?]] — Когда отправляется поезд? [[Wann kommen wir in Hamburg an?]] — Когда мы прибываем в Гамбург?"
      exercises:
        - q: "Как сказать «Поезд отправляется в девять часов»?"
          options: ["[[Der Zug fährt um neun Uhr ab.]]", "[[Der Zug abfährt um neun Uhr.]]", "[[Der Zug fährt ab um neun Uhr.]]", "[[Der Zug um neun Uhr abfährt.]]", "[[Der Zug ab fährt um neun Uhr.]]"]
        - q: "Как спросить «Когда прибывает поезд?»"
          options: ["[[Wann kommt der Zug an?]]", "[[Wann ankommt der Zug?]]", "[[Wann kommt an der Zug?]]", "[[Wann der Zug kommt an?]]", "[[Wann an kommt der Zug?]]"]
        - q: "Как правильно?"
          options: ["[[Um acht Uhr kommt der Bus an.]]", "[[Um acht Uhr der Bus kommt an.]]", "[[Um acht Uhr ankommt der Bus.]]", "[[Um acht Uhr kommt an der Bus.]]", "[[Um acht Uhr der Bus ankommt.]]"]
        - q: "Что значит [[Der Zug hat Verspätung.]]?"
          options: ["Поезд опаздывает.", "Поезд пришёл вовремя.", "Поезд уже ушёл.", "Поезд отменён.", "Поезд стоит на платформе."]
        - q: "Какое слово пропущено: [[Der Zug fährt um elf Uhr ...]]"
          options: ["[[ab]]", "[[an]]", "[[auf]]", "[[aus]]", "[[mit]]"]
    dialogue:
      title: "В справочной"
      speakers: {A: f, B: m}
      lines:
        - [A, "Entschuldigung, wann fährt der Zug nach Hamburg ab?", "Извините, когда отправляется поезд в Гамбург?"]
        - [B, "Um vierzehn Uhr zehn. Aber er hat heute zwanzig Minuten Verspätung.", "В четырнадцать десять. Но сегодня он опаздывает на двадцать минут."]
        - [A, "Oh nein! Und von welchem Gleis fährt der Zug ab?", "О нет! А с какого пути отправляется поезд?"]
        - [B, "Von Gleis sieben.", "С седьмого пути."]
        - [A, "Wann kommt der Zug in Hamburg an?", "Когда поезд прибывает в Гамбург?"]
        - [B, "Um siebzehn Uhr. Hören Sie bitte die Durchsage.", "В семнадцать часов. Слушайте, пожалуйста, объявление."]
        - [A, "Danke schön!", "Большое спасибо!"]
      questions:
        - q: "Куда едет женщина?"
          options: ["В Гамбург", "В Берлин", "В Мюнхен", "В Вену"]
        - q: "На сколько опаздывает поезд?"
          options: ["На двадцать минут", "На десять минут", "На час", "Он не опаздывает"]
        - q: "С какого пути отправляется поезд?"
          options: ["С седьмого", "С третьего", "С семнадцатого", "С первого"]

  - id: m12l04
    title: "Проблемы в поездке"
    intro: "В этом уроке вы научитесь объяснять, что случилось, и просить о помощи."
    words:
      - de: "verlieren"
        ru: "терять"
        ex: "Ich verliere oft meinen Schlüssel."
        exRu: "Я часто теряю ключ."
      - de: "verloren"
        ru: "потерял"
        ex: "Ich habe meinen Pass verloren."
        exRu: "Я потерял паспорт."
      - de: "gefunden"
        ru: "нашёл"
        ex: "Ich habe die Tasche gefunden."
        exRu: "Я нашёл сумку."
      - de: "stehlen"
