        - [B, "Prima! Darf ich wieder Sport treiben?", "Отлично! Мне снова можно заниматься спортом?"]
        - [A, "Ja, aber nicht zu viel. Gehen Sie zuerst spazieren oder schwimmen.", "Да, но не слишком много. Сначала гуляйте или плавайте."]
        - [B, "Und darf ich Wein trinken?", "А вино мне можно пить?"]
