    grammar:
      title: "Модальный глагол [[dürfen]]"
      explain:
        - "Глагол [[dürfen]] значит «можно», «разрешено». [[Darf ich hier sitzen?]] — «Можно мне здесь сесть?» Так вежливо просят разрешения."
        - "Формы: [[ich darf]], [[du darfst]], [[er darf]], [[sie darf]], [[wir dürfen]], [[ihr dürft]], [[sie dürfen]], вежливо [[Sie dürfen]]. В единственном числе умлаута нет: [[darf]]. Во множественном он есть: [[dürfen]]."
        - "Второй глагол, как всегда у модальных глаголов, стоит в конце: [[Sie dürfen wieder Sport treiben.]] — «Вам снова можно заниматься спортом»."
        - "С отрицанием [[nicht]] это значит «нельзя»: [[Sie dürfen nicht rauchen.]] — «Вам нельзя курить». С существительным говорят [[kein]]: [[Sie dürfen keinen Alkohol trinken.]]"
        - "Общий запрет звучит со словом [[man]]: [[Hier darf man nicht rauchen.]] — «Здесь нельзя курить». [[Hier darf man parken.]] — «Здесь можно парковаться»."
      exercises:
        - q: "Как вежливо спросить «Можно мне открыть окно?»"
          options: ["[[Darf ich das Fenster öffnen?]]", "[[Dürfe ich das Fenster öffnen?]]", "[[Darfst ich das Fenster öffnen?]]", "[[Darf ich öffnen das Fenster?]]", "[[Ich darf das Fenster öffnen?]]"]
        - q: "Выберите правильную форму: [[Wir ... hier nicht parken.]]"
          options: ["[[dürfen]]", "[[darf]]", "[[darfst]]", "[[dürft]]", "[[darfen]]"]
        - q: "Выберите правильную форму: [[Mein Vater ... keinen Kaffee trinken.]]"
          options: ["[[darf]]", "[[dürfen]]", "[[darfst]]", "[[dürft]]"]
        - q: "Как сказать «Вам нельзя курить»?"
          options: ["[[Sie dürfen nicht rauchen.]]", "[[Sie dürfen rauchen nicht.]]", "[[Sie darf nicht rauchen.]]", "[[Sie nicht dürfen rauchen.]]", "[[Dürfen Sie nicht rauchen.]]"]
        - q: "Что значит [[Hier darf man schwimmen]]?"
          options: ["Здесь можно плавать", "Здесь нельзя плавать", "Здесь нужно плавать", "Здесь хотят плавать"]
