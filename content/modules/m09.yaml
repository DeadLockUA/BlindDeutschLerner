    grammar:
      title: "Повелительное наклонение: [[Nehmen Sie]]"
      explain:
        - "Когда врач или аптекарь вежливо даёт указание, глагол ставится на первое место, а за ним идёт [[Sie]]: [[Nehmen Sie die Tabletten!]] — «Принимайте таблетки!»"
        - "Форма глагола такая же, как в обычном предложении с [[Sie]], только порядок слов другой. [[Sie trinken viel Wasser]] — «Вы пьёте много воды». [[Trinken Sie viel Wasser!]] — «Пейте много воды!»"
        - "Чтобы звучало мягче, добавляют [[bitte]]: [[Nehmen Sie bitte zwei Tabletten.]] или [[Bitte nehmen Sie zwei Tabletten.]]"
        - "Запрет строится с [[nicht]] или [[kein]]: [[Trinken Sie keinen Alkohol!]] [[Essen Sie nicht so viel!]]"
        - "У глаголов с отделяемой приставкой приставка уходит в конец: [[Kommen Sie morgen wieder.]] [[Rufen Sie mich an.]]"
        - "Особая форма у глагола [[sein]]: [[Seien Sie vorsichtig!]] — «Будьте осторожны!»"
      exercises:
        - q: "Как вежливо сказать «Принимайте мазь вечером»?"
          options: ["[[Nehmen Sie die Salbe am Abend.]]", "[[Sie nehmen die Salbe am Abend?]]", "[[Nimm Sie die Salbe am Abend.]]", "[[Nehmen die Salbe Sie am Abend.]]", "[[Nehmt Sie die Salbe am Abend.]]"]
        - q: "Как сказать «Пейте много чая»?"
          options: ["[[Trinken Sie viel Tee!]]", "[[Sie trinken viel Tee.]]", "[[Trinkt Sie viel Tee!]]", "[[Trinken viel Tee Sie!]]"]
        - q: "Как сказать «Приходите завтра снова»?"
          options: ["[[Kommen Sie morgen wieder.]]", "[[Wiederkommen Sie morgen.]]", "[[Kommen wieder Sie morgen.]]", "[[Sie kommen morgen wieder?]]", "[[Kommt Sie morgen wieder.]]"]
        - q: "Как сказать «Будьте осторожны!»?"
          options: ["[[Seien Sie vorsichtig!]]", "[[Sind Sie vorsichtig!]]", "[[Sein Sie vorsichtig!]]", "[[Ist Sie vorsichtig!]]"]
        - q: "Что значит [[Nehmen Sie die Tropfen vor dem Essen]]?"
          options: ["Принимайте капли перед едой", "Принимайте капли после еды", "Принимайте капли во время еды", "Не принимайте капли", "Принимайте капли три раза в день"]
    dialogue:
      title: "Средство от кашля"
      speakers: {A: f, B: m}
      lines:
        - [A, "Guten Tag! Was kann ich für Sie tun?", "Добрый день! Чем могу помочь?"]
        - [B, "Guten Tag! Haben Sie etwas gegen Husten?", "Добрый день! У вас есть что-нибудь от кашля?"]
        - [A, "Ja, hier ist ein Hustensaft. Haben Sie auch Fieber?", "Да, вот сироп от кашля. У вас есть ещё и температура?"]
        - [B, "Nein, kein Fieber. Brauche ich dafür ein Rezept?", "Нет, температуры нет. Мне нужен для этого рецепт?"]
        - [A, "Nein, das brauchen Sie nicht.", "Нет, он не нужен."]
