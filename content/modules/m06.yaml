    grammar:
      title: "Порядок слов: время в начале"
      explain:
        - "Многие глаголы распорядка дня разделяются: [[aufstehen]], [[anfangen]], [[fernsehen]], [[anziehen]]. Основная часть стоит на втором месте, приставка — в конце: [[Ich stehe auf.]] [[Ich sehe fern.]]"
        - "Немцы часто начинают предложение со времени: [[Um sieben Uhr]]. Но глагол всё равно должен стоять на втором месте. Поэтому [[ich]] переходит за глагол: [[Um sieben Uhr stehe ich auf.]]"
        - "Сравните: [[Ich stehe um sieben Uhr auf.]] и [[Um sieben Uhr stehe ich auf.]] Оба предложения правильные и значат одно и то же."
        - "Так же с другими словами времени: [[Dann frühstücke ich.]] [[Am Abend sehe ich fern.]] [[Normalerweise fängt die Arbeit um acht Uhr an.]]"
        - "Некоторые глаголы немного меняются: [[schlafen]] — [[er schläft]], [[anfangen]] — [[die Arbeit fängt an]], [[fernsehen]] — [[er sieht fern]]."
      exercises:
        - q: "Как сказать «В семь часов я встаю»?"
          options: ["[[Um sieben Uhr stehe ich auf.]]", "[[Um sieben Uhr ich stehe auf.]]", "[[Um sieben Uhr aufstehe ich.]]", "[[Um sieben Uhr stehe auf ich.]]", "[[Ich um sieben Uhr stehe auf.]]"]
        - q: "Как сказать «Вечером я смотрю телевизор»?"
          options: ["[[Am Abend sehe ich fern.]]", "[[Am Abend ich sehe fern.]]", "[[Am Abend fernsehe ich.]]", "[[Am Abend sehe fern ich.]]"]
        - q: "[[Die Arbeit ... um neun Uhr an.]] Какое слово пропущено?"
          options: ["[[fängt]]", "[[anfängt]]", "[[fangen]]", "[[anfangen]]", "[[fange]]"]
        - q: "Как сказать «Потом я завтракаю»?"
          options: ["[[Dann frühstücke ich.]]", "[[Dann ich frühstücke.]]", "[[Ich dann frühstücke.]]", "[[Dann frühstücken ich.]]"]
        - q: "Что значит [[Ich gehe um elf Uhr ins Bett.]]?"
          options: ["Я ложусь спать в одиннадцать", "Я встаю в одиннадцать", "Я иду домой в одиннадцать", "Я обедаю в одиннадцать", "Я иду на работу в одиннадцать"]
