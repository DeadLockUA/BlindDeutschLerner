    grammar:
      title: "Модальный глагол [[können]]"
      explain:
        - "Глагол [[können]] значит «мочь» или «уметь». [[Ich kann]] — «я могу», [[Sie können]] — «вы можете»."
        - "Формы: [[ich kann]], [[er kann]], [[sie kann]], [[wir können]], [[Sie können]], [[sie können]]. Обратите внимание: у [[ich]] и [[er]] одинаковая форма [[kann]], без окончания."
        - "Второй глагол стоит в самом конце предложения, в начальной форме: [[Ich kann morgen kommen.]] — «Я могу прийти завтра». [[Wir können um acht Uhr essen.]]"
        - "Вопрос: [[Können Sie am Freitag kommen?]] Ответ: [[Ja, gern.]] или [[Leider kann ich nicht.]] — «К сожалению, я не могу»."
        - "С друзьями на «ты» говорят [[du kannst]]: [[Kannst du kommen?]] Но мы пока используем вежливое [[Sie]]."
      exercises:
        - q: "[[Ich ... heute nicht kommen.]] Какое слово пропущено?"
          options: ["[[kann]]", "[[kannst]]", "[[können]]", "[[kanne]]", "[[könne]]"]
        - q: "Как спросить «Вы можете прийти в пятницу?»"
          options: ["[[Können Sie am Freitag kommen?]]", "[[Können Sie kommen am Freitag?]]", "[[Kann Sie am Freitag kommen?]]", "[[Sie können am Freitag kommen?]]", "[[Können Sie am Freitag kommt?]]"]
        - q: "[[Wir ... um acht Uhr essen.]] Какое слово пропущено?"
          options: ["[[können]]", "[[kann]]", "[[kannst]]", "[[könnt]]"]
        - q: "Как вежливо отказаться?"
          options: ["[[Das geht leider nicht.]]", "[[Gute Idee!]]", "[[Ja, gern.]]", "[[Natürlich komme ich!]]"]
        - q: "Как сказать «Я могу прийти в семь часов»?"
          options: ["[[Ich kann um sieben Uhr kommen.]]", "[[Ich kann kommen um sieben Uhr.]]", "[[Ich kann um sieben Uhr komme.]]", "[[Ich können um sieben Uhr kommen.]]", "[[Ich kann am sieben Uhr kommen.]]"]
