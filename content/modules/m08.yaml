    phrases:
      - de: "Wie finden Sie die Jacke?"
        ru: "Как вам куртка?"
      - de: "Ich finde sie toll."
        ru: "По-моему, она классная."
      - de: "Was mögen Sie lieber?"
        ru: "Что вам нравится больше?"
      - de: "Ich trage lieber Hosen."
        ru: "Я предпочитаю носить брюки."
      - de: "Das ist Geschmackssache."
        ru: "Это дело вкуса."
    grammar:
      title: "Охотно, охотнее, охотнее всего"
      explain:
        - "Слово [[gern]] значит «охотно», «с удовольствием». Его ставят после глагола: [[Ich trage gern Röcke.]] — «Я люблю носить юбки»."
        - "Если что-то нравится больше, говорят [[lieber]]: [[Ich trage lieber Hosen.]] — «Я предпочитаю брюки»."
        - "А то, что нравится больше всего, — [[am liebsten]]: [[Am liebsten trage ich Kleider.]] — «Больше всего я люблю носить платья»."
        - "Итак, три ступени: [[gern]], [[lieber]], [[am liebsten]]. Сравните с русским: «хорошо», «лучше», «лучше всего»."
        - "С существительным часто используют глагол [[mögen]]: [[ich mag]], [[Sie mögen]], [[er mag]]. [[Ich mag Kaffee.]] [[Mögen Sie Tee?]]"
        - "Своё мнение выражают глаголом [[finden]]: [[Wie finden Sie das Kleid?]] — [[Ich finde es schön.]]"
      exercises:
        - q: "Как сказать «Я предпочитаю чай»?"
          options: ["[[Ich trinke lieber Tee.]]", "[[Ich trinke am liebsten Tee.]]", "[[Ich trinke gern lieber Tee.]]", "[[Ich lieber trinke Tee.]]", "[[Ich trinke Tee lieber gern.]]"]
        - q: "Как сказать «Больше всего я люблю носить платья»?"
          options: ["[[Am liebsten trage ich Kleider.]]", "[[Am liebsten ich trage Kleider.]]", "[[Lieber trage ich Kleider.]]", "[[Gern trage ich am Kleider.]]"]
        - q: "Как правильно: «Он любит кофе»?"
          options: ["[[Er mag Kaffee.]]", "[[Er mögt Kaffee.]]", "[[Er magt Kaffee.]]", "[[Er mögen Kaffee.]]", "[[Er magst Kaffee.]]"]
        - q: "Как спросить «Как вам платье?»"
          options: ["[[Wie finden Sie das Kleid?]]", "[[Was finden Sie das Kleid?]]", "[[Wie finden Sie dem Kleid?]]", "[[Wo finden Sie das Kleid?]]"]
        - q: "Какое слово значит «удобный»?"
          options: ["[[bequem]]", "[[praktisch]]", "[[schick]]", "[[hässlich]]", "[[bunt]]"]
    dialogue:
      title: "Что надеть?"
