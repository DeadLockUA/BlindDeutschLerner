  - id: m08l05
    title: "Что вам нравится?"
    intro: "В этом уроке вы научитесь говорить, что вам нравится, что вы предпочитаете и что любите больше всего."
    words:
      - de: "mögen"
        ru: "любить, нравиться"
        ex: "Ich mag blaue Hemden."
        exRu: "Мне нравятся синие рубашки."
      - de: "lieber"
        ru: "охотнее, лучше"
        ex: "Ich trinke lieber Tee."
        exRu: "Я предпочитаю чай."
      - de: "am liebsten"
        ru: "больше всего"
        ex: "Am liebsten trage ich Jeans."
        exRu: "Больше всего я люблю носить джинсы."
      - de: "finden"
        ru: "находить, считать"
        ex: "Ich finde den Rock schön."
        exRu: "Я считаю, что юбка красивая."
      - de: "toll"
