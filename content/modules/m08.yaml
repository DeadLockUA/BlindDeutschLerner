        ex: "Das Hemd ist schick."
        exRu: "Рубашка нарядная."
      - de: "bunt"
        ru: "пёстрый"
        ex: "Ich mag bunte Kleider."
        exRu: "Мне нравятся пёстрые платья."
      - de: "furchtbar"
