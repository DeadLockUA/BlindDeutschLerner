    grammar:
      title: "Куда? Предлог «к»"
      explain:
        - "На вопрос «куда?», по-немецки [[wohin]], часто отвечают с предлогом [[zu]]. После него тоже идёт дательный падеж."
        - "[[zu dem]] сливается в [[zum]]: [[der Markt]] — [[zum Markt]], [[das Rathaus]] — [[zum Rathaus]]. [[zu der]] сливается в [[zur]]: [[die Post]] — [[zur Post]], [[die Bibliothek]] — [[zur Bibliothek]]."
        - "Итак: мужской и средний род — [[zum]], женский род — [[zur]]. [[Ich gehe zum Zoo.]] [[Ich gehe zur Bank.]]"
        - "Домой — [[nach Hause]], это ответ на вопрос «куда?». Дома — [[zu Hause]], это ответ на вопрос «где?». [[Ich gehe nach Hause.]] Но: [[Ich bin zu Hause.]]"
        - "С городами и странами без артикля используют [[nach]]: [[Ich fahre nach Berlin.]]"
      exercises:
        - q: "Как сказать «к рынку»?"
          options: ["[[zum Markt]]", "[[zur Markt]]", "[[zu die Markt]]", "[[nach Markt]]", "[[im Markt]]"]
        - q: "Как сказать «Я иду в библиотеку»?"
          options: ["[[Ich gehe zur Bibliothek.]]", "[[Ich gehe zum Bibliothek.]]", "[[Ich gehe nach Bibliothek.]]", "[[Ich gehe zu Hause Bibliothek.]]"]
        - q: "Как сказать «Я дома»?"
          options: ["[[Ich bin zu Hause.]]", "[[Ich bin nach Hause.]]", "[[Ich bin zum Haus.]]", "[[Ich gehe nach Hause.]]"]
        - q: "Как сказать «Мы едем домой»?"
          options: ["[[Wir fahren nach Hause.]]", "[[Wir fahren zu Hause.]]", "[[Wir fahren zur Hause.]]", "[[Wir fahren im Hause.]]"]
        - q: "Как правильно?"
          options: ["[[Peter fährt nach Wien.]]", "[[Peter fährt zum Wien.]]", "[[Peter fährt zur Wien.]]", "[[Peter fährt zu Hause Wien.]]"]
        - q: "Как сказать «к ратуше»?"
          options: ["[[zum Rathaus]]", "[[zur Rathaus]]", "[[zu das Rathaus]]", "[[nach Rathaus]]"]
    dialogue:
