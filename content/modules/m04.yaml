        - "Когда мы что-то покупаем, берём или хотим, предмет стоит в винительном падеже. По-немецки он называется [[Akkusativ]]. Он отвечает на вопрос «что?» или «кого?»: покупаю что?"
        - "Хорошая новость: меняется только мужской род. [[Der]] становится [[den]], а [[ein]] становится [[einen]]."
        - "[[Der Käse ist gut.]] — но [[Ich kaufe den Käse.]] [[Das ist ein Apfel.]] — но [[Ich esse einen Apfel.]]"
        - "Женский и средний род не меняются: [[Ich kaufe eine Flasche.]] [[Ich kaufe das Brot.]] Множественное число тоже: [[Ich kaufe die Äpfel.]]"
