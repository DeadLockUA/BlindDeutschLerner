      explain:
        - "В кафе и магазине вежливо говорят не «я хочу», а «я хотел бы». По-немецки это [[ich möchte]]."
        - "Формы простые: [[ich möchte]], [[er möchte]], [[sie möchte]] — одинаково. [[Wir möchten]], [[Sie möchten]] — тоже одинаково."
        - "После [[möchte]] можно просто назвать предмет: [[Ich möchte einen Kaffee.]] [[Ich möchte ein Stück Kuchen.]] Не забывайте [[einen]] с мужским родом."
        - "Если есть второй глагол, он уходит в самый конец: [[Ich möchte bestellen.]] [[Wir möchten bezahlen.]] [[Was möchten Sie trinken?]]"
        - "Официант спрашивает: [[Was möchten Sie?]] Вы отвечаете: [[Ich möchte einen Tee, bitte.]] Это вежливо и всегда уместно."
