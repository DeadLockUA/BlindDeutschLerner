    grammar:
      title: "Глаголы с изменением гласной"
      explain:
        - "У некоторых глаголов гласная в основе меняется. Это бывает только в двух формах: с [[du]] и с [[er]], [[sie]], [[es]]."
        - "Глагол [[lesen]], «читать»: [[ich lese]], [[du liest]], [[er liest]], но [[wir lesen]], [[Sie lesen]]. Вместо [[e]] появляется долгое [[ie]]."
        - "Так же [[sehen]], «видеть»: [[ich sehe]], [[er sieht]]. Другие глаголы меняют [[e]] на [[i]]: [[sprechen]] — [[er spricht]], [[treffen]] — [[er trifft]], [[essen]] — [[er isst]]."
        - "А у глаголов [[fahren]] и [[laufen]] появляется умлаут: [[er fährt]], [[er läuft]]."
        - "Обычные глаголы, например [[spielen]], [[tanzen]], [[singen]], гласную не меняют: [[er spielt]], [[sie tanzt]], [[er singt]]."
      exercises:
        - q: "Выберите правильную форму: [[Anna ... ein Buch.]]"
          options: ["[[liest]]", "[[lest]]", "[[lese]]", "[[lesen]]", "[[liesst]]"]
        - q: "Выберите правильную форму: [[Peter ... gern Filme.]]"
