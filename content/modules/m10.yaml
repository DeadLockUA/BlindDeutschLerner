id: m10
title: "Работа и хобби"
lessons:
  - id: m10l01
    title: "Профессии"
    intro: "В этом уроке вы выучите названия профессий и научитесь рассказывать, кем вы работаете."
    words:
      - de: "der Beruf"
        ru: "профессия"
        plural: "die Berufe"
        ex: "Mein Beruf ist interessant."
        exRu: "Моя профессия интересная."
      - de: "der Ingenieur"
        ru: "инженер"
        plural: "die Ingenieure"
        ex: "Mein Bruder ist Ingenieur."
        exRu: "Мой брат инженер."
      - de: "die Krankenschwester"
        ru: "медсестра"
        plural: "die Krankenschwestern"
        ex: "Maria ist Krankenschwester im Krankenhaus."
        exRu: "Мария медсестра в больнице."
      - de: "der Koch"
        ru: "повар"
        plural: "die Köche"
        ex: "Der Koch macht eine Suppe."
        exRu: "Повар готовит суп."
      - de: "die Köchin"
        ru: "повариха"
        plural: "die Köchinnen"
        ex: "Die Köchin arbeitet im Restaurant."
        exRu: "Повариха работает в ресторане."
      - de: "der Fahrer"
        ru: "водитель"
        plural: "die Fahrer"
        ex: "Der Fahrer wartet vor dem Haus."
        exRu: "Водитель ждёт перед домом."
      - de: "der Polizist"
        ru: "полицейский"
        plural: "die Polizisten"
        ex: "Der Polizist ist sehr freundlich."
        exRu: "Полицейский очень приветливый."
      - de: "die Polizistin"
        ru: "женщина-полицейский"
        plural: "die Polizistinnen"
        ex: "Meine Schwester ist Polizistin."
        exRu: "Моя сестра работает в полиции."
      - de: "der Friseur"
        ru: "парикмахер"
        plural: "die Friseure"
        ex: "Morgen gehe ich zum Friseur."
        exRu: "Завтра я иду к парикмахеру."
      - de: "die Friseurin"
        ru: "женщина-парикмахер"
        plural: "die Friseurinnen"
        ex: "Die Friseurin heißt Sophie."
        exRu: "Парикмахершу зовут Софи."
      - de: "der Mechaniker"
        ru: "механик"
        plural: "die Mechaniker"
        ex: "Der Mechaniker repariert das Auto."
        exRu: "Механик ремонтирует машину."
      - de: "der Programmierer"
        ru: "программист"
        plural: "die Programmierer"
        ex: "Thomas ist Programmierer."
        exRu: "Томас программист."
      - de: "die Hausfrau"
        ru: "домохозяйка"
        plural: "die Hausfrauen"
        ex: "Meine Mutter ist Hausfrau."
        exRu: "Моя мама домохозяйка."
      - de: "der Rentner"
        ru: "пенсионер"
        plural: "die Rentner"
        ex: "Mein Großvater ist Rentner."
        exRu: "Мой дедушка пенсионер."
    phrases:
      - de: "Was sind Sie von Beruf?"
        ru: "Кем вы работаете?"
      - de: "Was machen Sie beruflich?"
        ru: "Чем вы занимаетесь по работе?"
      - de: "Ich arbeite als Koch."
        ru: "Я работаю поваром."
      - de: "Ich bin Ingenieur von Beruf."
        ru: "По профессии я инженер."
      - de: "Ich bin arbeitslos."
        ru: "Я безработный."
      - de: "Ich bin in Rente."
        ru: "Я на пенсии."
    grammar:
      title: "Профессии мужчин и женщин"
      explain:
        - "Чтобы назвать профессию женщины, к слову часто добавляют окончание [[-in]]: [[der Programmierer]], [[die Programmiererin]]; [[der Polizist]], [[die Polizistin]]; [[der Friseur]], [[die Friseurin]]."
        - "Женская форма всегда женского рода, с артиклем [[die]]. Во множественном числе у неё окончание [[-innen]]: [[die Friseurinnen]], [[die Polizistinnen]]."
        - "Иногда гласная получает умлаут: [[der Koch]], [[die Köchin]]; [[der Arzt]], [[die Ärztin]]."
        - "Есть исключения: [[die Krankenschwester]] — это медсестра, а мужчина — [[der Krankenpfleger]]. [[die Hausfrau]] — домохозяйка, а мужчина — [[der Hausmann]]."
        - "Важно: о своей профессии говорят без артикля. [[Ich bin Koch.]] [[Sie ist Ingenieurin.]] Не говорят «[[Ich bin ein Koch]]» в этом смысле."
        - "Вопрос о профессии: [[Was sind Sie von Beruf?]] Ответ: [[Ich bin Mechaniker.]] или [[Ich arbeite als Mechaniker.]]"
      exercises:
        - q: "Как называется женщина-программист?"
          options: ["[[die Programmiererin]]", "[[der Programmiererin]]", "[[die Programmierer]]", "[[die Programmierin]]", "[[das Programmiererin]]"]
        - q: "Как называется женщина-повар?"
          options: ["[[die Köchin]]", "[[die Kochin]]", "[[die Kochfrau]]", "[[der Köchin]]", "[[die Köche]]"]
        - q: "Как правильно сказать «Анна полицейский»?"
          options: ["[[Anna ist Polizistin.]]", "[[Anna ist Polizist.]]", "[[Anna ist eine Polizist.]]", "[[Anna ist der Polizistin.]]", "[[Anna sind Polizistin.]]"]
        - q: "Как правильно сказать «Я механик»?"
          options: ["[[Ich bin Mechaniker.]]", "[[Ich bin der Mechaniker.]]", "[[Ich habe Mechaniker.]]", "[[Ich ist Mechaniker.]]"]
        - q: "Как назвать нескольких женщин-парикмахеров?"
          options: ["[[die Friseurinnen]]", "[[die Friseurin]]", "[[die Friseure]]", "[[die Friseurinen]]", "[[die Friseurins]]"]
        - q: "Как спросить о профессии?"
          options: ["[[Was sind Sie von Beruf?]]", "[[Wie sind Sie von Beruf?]]", "[[Wer sind Sie von Beruf?]]", "[[Was haben Sie von Beruf?]]"]
    dialogue:
      title: "Знакомство на празднике"
      speakers: {A: f, B: m}
      lines:
        - [A, "Guten Abend! Ich bin Sophie Weber.", "Добрый вечер! Я Софи Вебер."]
        - [B, "Guten Abend! Peter Schmidt. Was sind Sie von Beruf, Frau Weber?", "Добрый вечер! Петер Шмидт. Кем вы работаете, госпожа Вебер?"]
        - [A, "Ich bin Krankenschwester. Und Sie?", "Я медсестра. А вы?"]
        - [B, "Ich arbeite als Koch in einem Restaurant.", "Я работаю поваром в ресторане."]
        - [A, "Oh, toll! Kochen Sie auch zu Hause?", "О, здорово! А дома вы тоже готовите?"]
        - [B, "Nein, zu Hause kocht meine Frau. Sie ist Köchin.", "Нет, дома готовит моя жена. Она повариха."]
        - [A, "Mein Mann ist Mechaniker. Er kocht nie!", "Мой муж механик. Он никогда не готовит!"]
      questions:
        - q: "Кем работает Софи?"
          options: ["Медсестрой", "Поварихой", "Врачом"]
        - q: "Где работает Петер?"
          options: ["В ресторане", "В больнице", "В мастерской"]
        - q: "Кто муж Софи по профессии?"
          options: ["Механик", "Повар", "Инженер"]

  - id: m10l02
    title: "На работе"
    intro: "В этом уроке вы выучите слова об офисе и повторите спряжение обычных глаголов."
    words:
      - de: "die Arbeit"
        ru: "работа"
        ex: "Die Arbeit beginnt um acht Uhr."
        exRu: "Работа начинается в восемь часов."
      - de: "die Firma"
        ru: "фирма"
        plural: "die Firmen"
        ex: "Die Firma ist sehr groß."
        exRu: "Фирма очень большая."
      - de: "das Büro"
        ru: "офис"
        plural: "die Büros"
        ex: "Mein Büro ist im dritten Stock."
        exRu: "Мой офис на четвёртом этаже."
      - de: "der Chef"
        ru: "начальник"
        plural: "die Chefs"
        ex: "Der Chef ist heute nicht da."
        exRu: "Начальника сегодня нет."
      - de: "die Chefin"
        ru: "начальница"
        plural: "die Chefinnen"
        ex: "Meine Chefin ist sehr nett."
        exRu: "Моя начальница очень приятная."
      - de: "der Mitarbeiter"
        ru: "сотрудник"
        plural: "die Mitarbeiter"
        ex: "Die Firma hat fünfzig Mitarbeiter."
        exRu: "В фирме пятьдесят сотрудников."
      - de: "der Computer"
        ru: "компьютер"
        plural: "die Computer"
        ex: "Der Computer ist neu."
        exRu: "Компьютер новый."
      - de: "der Drucker"
        ru: "принтер"
        plural: "die Drucker"
        ex: "Der Drucker ist kaputt."
        exRu: "Принтер сломан."
      - de: "das Telefon"
        ru: "телефон"
        plural: "die Telefone"
        ex: "Das Telefon klingelt."
        exRu: "Звонит телефон."
      - de: "die Besprechung"
        ru: "совещание"
        plural: "die Besprechungen"
        ex: "Die Besprechung dauert eine Stunde."
        exRu: "Совещание длится час."
      - de: "schreiben"
        ru: "писать"
        ex: "Ich schreibe eine E-Mail."
        exRu: "Я пишу электронное письмо."
      - de: "telefonieren"
        ru: "говорить по телефону"
        ex: "Frau Schmidt telefoniert gerade."
        exRu: "Госпожа Шмидт сейчас говорит по телефону."
    phrases:
      - de: "Ich arbeite bei einer Firma."
        ru: "Я работаю в фирме."
      - de: "Ich habe viel zu tun."
        ru: "У меня много дел."
      - de: "Ich bin gerade in einer Besprechung."
        ru: "Я сейчас на совещании."
      - de: "Ich arbeite Teilzeit."
        ru: "Я работаю неполный день."
      - de: "Ich rufe später zurück."
        ru: "Я перезвоню позже."
      - de: "Ich mache jetzt Feierabend."
        ru: "Я заканчиваю рабочий день."
    grammar:
      title: "Спряжение обычных глаголов"
      explain:
        - "У немецкого глагола есть основа и окончание [[-en]]. Например, [[machen]]: основа [[mach]]. К основе добавляют окончания по лицам."
        - "Окончания такие: [[ich mache]], [[du machst]], [[er macht]], [[sie macht]], [[wir machen]], [[ihr macht]], [[sie machen]], [[Sie machen]]."
        - "Удобно запомнить: у [[wir]], у [[sie]] во множественном числе и у вежливого [[Sie]] форма совпадает с неопределённой: [[machen]], [[schreiben]], [[telefonieren]]."
        - "Если основа кончается на [[t]] или [[d]], добавляется звук [[e]], чтобы легче произносить: [[arbeiten]] — [[du arbeitest]], [[er arbeitet]]. Так же [[warten]] — [[er wartet]]."
        - "Глагол стоит на втором месте в предложении: [[Ich schreibe eine E-Mail.]] [[Heute arbeite ich im Büro.]]"
      exercises:
        - q: "Выберите правильную форму: [[Er ... eine E-Mail.]]"
          options: ["[[schreibt]]", "[[schreibe]]", "[[schreiben]]", "[[schreibst]]", "[[schreibet]]"]
        - q: "Выберите правильную форму: [[Wir ... im Büro.]]"
          options: ["[[arbeiten]]", "[[arbeite]]", "[[arbeitet]]", "[[arbeitest]]", "[[arbeit]]"]
        - q: "Выберите правильную форму: [[Meine Chefin ... viel.]]"
          options: ["[[telefoniert]]", "[[telefonieren]]", "[[telefoniere]]", "[[telefonierst]]"]
        - q: "Как правильно?"
          options: ["[[Er arbeitet bei einer Firma.]]", "[[Er arbeit bei einer Firma.]]", "[[Er arbeitest bei einer Firma.]]", "[[Er arbeiten bei einer Firma.]]", "[[Er arbeite bei einer Firma.]]"]
        - q: "Как правильно?"
          options: ["[[Heute arbeite ich zu Hause.]]", "[[Heute ich arbeite zu Hause.]]", "[[Heute arbeiten ich zu Hause.]]", "[[Ich heute arbeite zu Hause.]]", "[[Arbeite heute ich zu Hause.]]"]
    dialogue:
      title: "Звонок в офис"
      speakers: {A: m, B: f}
      lines:
        - [B, "Firma Bauer, Maria Klein, guten Tag!", "Фирма Бауэр, Мария Кляйн, добрый день!"]
        - [A, "Guten Tag! Hier ist Lukas Wagner. Ist Frau Bauer da?", "Добрый день! Это Лукас Вагнер. Госпожа Бауэр на месте?"]
        - [B, "Die Chefin ist gerade in einer Besprechung.", "Начальница сейчас на совещании."]
        - [A, "Wie lange dauert die Besprechung?", "Сколько продлится совещание?"]
        - [B, "Bis elf Uhr. Sie ruft später zurück.", "До одиннадцати. Она перезвонит позже."]
        - [A, "Gut. Meine Nummer ist null eins sieben zwei, drei vier fünf.", "Хорошо. Мой номер ноль один семь два, три четыре пять."]
        - [B, "Danke, ich schreibe die Nummer auf.", "Спасибо, я запишу номер."]
        - [A, "Vielen Dank! Auf Wiederhören!", "Большое спасибо! До свидания!"]
      questions:
        - q: "Где сейчас госпожа Бауэр?"
          options: ["На совещании", "Дома", "В отпуске"]
        - q: "До которого часа длится совещание?"
          options: ["До одиннадцати", "До двенадцати", "До десяти"]
        - q: "Что сделает госпожа Бауэр?"
          options: ["Перезвонит позже", "Напишет письмо", "Придёт к Лукасу"]

  - id: m10l03
    title: "Учёба и курсы"
    intro: "В этом уроке вы поговорите об учёбе и выучите глагол «хотеть», [[wollen]]."
    words:
      - de: "die Universität"
        ru: "университет"
        plural: "die Universitäten"
        ex: "Die Universität ist im Zentrum."
        exRu: "Университет в центре."
      - de: "der Kurs"
        ru: "курс"
        plural: "die Kurse"
        ex: "Der Kurs beginnt am Montag."
        exRu: "Курс начинается в понедельник."
      - de: "der Unterricht"
        ru: "урок, занятия"
        ex: "Der Unterricht dauert neunzig Minuten."
        exRu: "Занятие длится девяносто минут."
      - de: "lernen"
        ru: "учить, учиться"
        ex: "Ich lerne jeden Tag zehn Wörter."
        exRu: "Я учу каждый день десять слов."
      - de: "studieren"
        ru: "учиться в вузе"
        ex: "Meine Tochter studiert in Berlin."
        exRu: "Моя дочь учится в Берлине."
      - de: "der Schüler"
        ru: "школьник"
        plural: "die Schüler"
        ex: "Der Schüler ist zwölf Jahre alt."
        exRu: "Школьнику двенадцать лет."
      - de: "die Prüfung"
        ru: "экзамен"
        plural: "die Prüfungen"
        ex: "Die Prüfung ist im Juni."
        exRu: "Экзамен в июне."
      - de: "die Hausaufgabe"
        ru: "домашнее задание"
        plural: "die Hausaufgaben"
        ex: "Die Hausaufgabe ist leicht."
        exRu: "Домашнее задание лёгкое."
      - de: "das Buch"
        ru: "книга"
        plural: "die Bücher"
        ex: "Das Buch ist sehr interessant."
        exRu: "Книга очень интересная."
      - de: "das Wörterbuch"
        ru: "словарь"
        plural: "die Wörterbücher"
        ex: "Ich brauche ein Wörterbuch."
        exRu: "Мне нужен словарь."
      - de: "das Heft"
        ru: "тетрадь"
        plural: "die Hefte"
        ex: "Schreiben Sie das Wort ins Heft."
        exRu: "Запишите слово в тетрадь."
      - de: "der Kugelschreiber"
        ru: "ручка"
        plural: "die Kugelschreiber"
        ex: "Haben Sie einen Kugelschreiber?"
        exRu: "У вас есть ручка?"
      - de: "der Bleistift"
        ru: "карандаш"
        plural: "die Bleistifte"
        ex: "Der Bleistift liegt auf dem Tisch."
        exRu: "Карандаш лежит на столе."
    phrases:
      - de: "Ich mache einen Deutschkurs."
        ru: "Я хожу на курс немецкого."
      - de: "Ich studiere Medizin."
        ru: "Я изучаю медицину."
      - de: "Ich habe morgen eine Prüfung."
        ru: "У меня завтра экзамен."
      - de: "Ich habe die Prüfung bestanden."
        ru: "Я сдал экзамен."
      - de: "Hören Sie bitte zu."
        ru: "Послушайте, пожалуйста."
      - de: "Öffnen Sie das Buch auf Seite zehn."
        ru: "Откройте книгу на десятой странице."
    grammar:
      title: "Модальный глагол [[wollen]]"
      explain:
        - "Глагол [[wollen]] значит «хотеть», причём твёрдо, как план или решение: [[Ich will Deutsch lernen.]] — «Я хочу выучить немецкий»."
        - "Формы: [[ich will]], [[du willst]], [[er will]], [[sie will]], [[wir wollen]], [[ihr wollt]], [[sie wollen]], вежливо [[Sie wollen]]. У [[ich]] и [[er]] одна и та же форма: [[will]]."
        - "Осторожно: немецкое [[will]] похоже на английское слово, но значит «хочу», а не «буду»."
        - "Второй глагол стоит в конце предложения: [[Maria will in Berlin studieren.]] [[Wir wollen eine Prüfung machen.]]"
        - "Когда вежливо просят что-то в магазине или кафе, лучше сказать [[Ich möchte]], а не [[Ich will]]. [[Ich will]] звучит слишком резко."
      exercises:
        - q: "Выберите правильную форму: [[Ich ... Medizin studieren.]]"
          options: ["[[will]]", "[[wolle]]", "[[willst]]", "[[wollen]]", "[[wollt]]"]
        - q: "Выберите правильную форму: [[Wir ... einen Kurs machen.]]"
          options: ["[[wollen]]", "[[will]]", "[[wollt]]", "[[willst]]", "[[wollst]]"]
        - q: "Выберите правильную форму: [[Thomas ... Ingenieur werden.]]"
          options: ["[[will]]", "[[wollen]]", "[[willt]]", "[[willst]]"]
        - q: "Как правильно?"
          options: ["[[Sie will Deutsch lernen.]]", "[[Sie will lernen Deutsch.]]", "[[Sie wollt Deutsch lernen.]]", "[[Sie will Deutsch lernt.]]", "[[Sie lernen will Deutsch.]]"]
        - q: "Как вежливо попросить кофе в кафе?"
          options: ["[[Ich möchte einen Kaffee, bitte.]]", "[[Ich will einen Kaffee!]]", "[[Kaffee will ich!]]", "[[Ich wollen einen Kaffee.]]"]
    dialogue:
      title: "После урока"
      speakers: {A: f, B: m}
      lines:
        - [A, "Herr Novak, haben Sie Ihre Hausaufgabe?", "Господин Новак, у вас есть домашнее задание?"]
        - [B, "Ja, hier ist mein Heft.", "Да, вот моя тетрадь."]
        - [A, "Sehr gut! Warum lernen Sie Deutsch?", "Очень хорошо! Почему вы учите немецкий?"]
        - [B, "Ich will in Deutschland studieren.", "Я хочу учиться в Германии."]
        - [A, "Was wollen Sie studieren?", "Что вы хотите изучать?"]
        - [B, "Medizin. Ich will Arzt werden.", "Медицину. Я хочу стать врачом."]
        - [A, "Toll! Aber zuerst kommt die Prüfung im Mai.", "Здорово! Но сначала экзамен в мае."]
        - [B, "Ja, ich lerne jeden Tag.", "Да, я занимаюсь каждый день."]
      questions:
        - q: "Где господин Новак хочет учиться?"
          options: ["В Германии", "В Австрии", "В России"]
        - q: "Кем он хочет стать?"
          options: ["Врачом", "Учителем", "Инженером"]
        - q: "Когда будет экзамен?"
          options: ["В мае", "В июне", "Завтра"]

  - id: m10l04
    title: "Хобби"
