        - q: "Выберите правильную форму: [[Mein Vater ... jeden Morgen im Park.]]"
          options: ["[[läuft]]", "[[lauft]]", "[[laufe]]", "[[laufen]]", "[[läufen]]"]
        - q: "Выберите правильную форму: [[Wir ... gern Bücher.]]"
          options: ["[[lesen]]", "[[liest]]", "[[liesen]]", "[[lest]]", "[[lese]]"]
        - q: "Как сказать «Она хорошо говорит по-немецки»?"
          options: ["[[Sie spricht gut Deutsch.]]", "[[Sie sprecht gut Deutsch.]]", "[[Sie sprich gut Deutsch.]]", "[[Sie sprechen gut Deutsch.]]", "[[Sie spreche gut Deutsch.]]"]
    dialogue:
