  - id: m10l05
    title: "Свободное время"
    intro: "В этом уроке вы научитесь говорить, как часто вы что-то делаете: всегда, часто, иногда или никогда."
    words:
      - de: "das Konzert"
        ru: "концерт"
        plural: "die Konzerte"
        ex: "Das Konzert ist am Samstag."
        exRu: "Концерт в субботу."
      - de: "der Film"
        ru: "фильм"
        plural: "die Filme"
        ex: "Der Film ist sehr lustig."
        exRu: "Фильм очень смешной."
      - de: "das Fernsehen"
        ru: "телевидение"
        ex: "Im Fernsehen kommt ein Krimi."
        exRu: "По телевизору идёт детектив."
      - de: "das Radio"
        ru: "радио"
        plural: "die Radios"
        ex: "Am Morgen höre ich Radio."
        exRu: "Утром я слушаю радио."
      - de: "die Zeitung"
        ru: "газета"
        plural: "die Zeitungen"
        ex: "Mein Vater liest die Zeitung."
        exRu: "Мой отец читает газету."
      - de: "die Zeitschrift"
        ru: "журнал"
        plural: "die Zeitschriften"
        ex: "Die Zeitschrift kostet drei Euro."
        exRu: "Журнал стоит три евро."
      - de: "der Verein"
        ru: "клуб, общество"
        plural: "die Vereine"
        ex: "Unser Sohn spielt im Verein Fußball."
        exRu: "Наш сын играет в футбол в клубе."
      - de: "immer"
        ru: "всегда"
        ex: "Am Sonntag schlafe ich immer lange."
        exRu: "В воскресенье я всегда долго сплю."
      - de: "oft"
        ru: "часто"
        ex: "Wir gehen oft ins Kino."
        exRu: "Мы часто ходим в кино."
      - de: "manchmal"
        ru: "иногда"
        ex: "Manchmal koche ich am Abend."
        exRu: "Иногда я готовлю вечером."
      - de: "selten"
        ru: "редко"
        ex: "Ich sehe selten fern."
        exRu: "Я редко смотрю телевизор."
      - de: "nie"
        ru: "никогда"
        ex: "Er trinkt nie Kaffee."
        exRu: "Он никогда не пьёт кофе."
    phrases:
      - de: "Karten spielen"
        ru: "играть в карты"
        ex: "Am Freitag spielen wir Karten."
        exRu: "В пятницу мы играем в карты."
      - de: "Freunde treffen"
        ru: "встречаться с друзьями"
        ex: "Am Wochenende treffe ich Freunde."
        exRu: "По выходным я встречаюсь с друзьями."
      - de: "ins Kino gehen"
        ru: "ходить в кино"
        ex: "Wollen wir ins Kino gehen?"
        exRu: "Пойдём в кино?"
      - de: "Was läuft im Kino?"
        ru: "Что идёт в кино?"
      - de: "Ich bin Mitglied in einem Verein."
        ru: "Я состою в клубе."
      - de: "Wie oft machen Sie das?"
        ru: "Как часто вы это делаете?"
    grammar:
      title: "Как часто: наречия частоты"
      explain:
        - "Пять важных слов от самого частого до самого редкого: [[immer]] — всегда, [[oft]] — часто, [[manchmal]] — иногда, [[selten]] — редко, [[nie]] — никогда."
        - "Обычно наречие стоит сразу после глагола: [[Ich gehe oft ins Kino.]] [[Sie liest manchmal die Zeitung.]]"
        - "Можно поставить наречие на первое место. Тогда глагол всё равно остаётся вторым, а подлежащее идёт после него: [[Manchmal gehe ich ins Konzert.]] [[Oft spielen wir Karten.]]"
        - "Слово [[nie]] само означает «никогда не». Второе отрицание не нужно: [[Ich rauche nie.]] — «Я никогда не курю»."
        - "Спросить о частоте можно так: [[Wie oft gehen Sie ins Kino?]] Ответ: [[Einmal pro Woche.]] — «Раз в неделю»."
      exercises:
        - q: "Как сказать «Я часто слушаю радио»?"
          options: ["[[Ich höre oft Radio.]]", "[[Ich oft höre Radio.]]", "[[Oft ich höre Radio.]]", "[[Ich höre Radio oft nicht.]]", "[[Ich höre selten Radio.]]"]
        - q: "Как правильно?"
          options: ["[[Manchmal treffe ich Freunde.]]", "[[Manchmal ich treffe Freunde.]]", "[[Manchmal treffen ich Freunde.]]", "[[Ich manchmal treffe Freunde.]]", "[[Treffe manchmal ich Freunde.]]"]
        - q: "Как сказать «Он никогда не смотрит телевизор»?"
          options: ["[[Er sieht nie fern.]]", "[[Er sieht nicht nie fern.]]", "[[Er sieht immer fern.]]", "[[Er nie sieht fern.]]", "[[Er sieht oft fern.]]"]
        - q: "Что значит [[selten]]?"
          options: ["Редко", "Часто", "Иногда", "Всегда", "Никогда"]
        - q: "Какое слово значит «всегда»?"
          options: ["[[immer]]", "[[oft]]", "[[manchmal]]", "[[nie]]", "[[selten]]"]
    dialogue:
      title: "Планы на вечер"
      speakers: {A: f, B: m}
      lines:
        - [A, "Herr Wagner, gehen Sie oft ins Kino?", "Господин Вагнер, вы часто ходите в кино?"]
        - [B, "Nein, selten. Ich sehe Filme meistens im Fernsehen.", "Нет, редко. Фильмы я обычно смотрю по телевизору."]
        - [A, "Heute läuft im Kino ein neuer Film. Kommen Sie mit?", "Сегодня в кино идёт новый фильм. Пойдёте со мной?"]
        - [B, "Heute geht es leider nicht. Am Mittwoch spiele ich immer Karten.", "Сегодня, к сожалению, не получится. По средам я всегда играю в карты."]
        - [A, "Mit wem spielen Sie?", "С кем вы играете?"]
        - [B, "Mit Freunden aus meinem Verein.", "С друзьями из моего клуба."]
        - [A, "Und am Freitag?", "А в пятницу?"]
        - [B, "Am Freitag habe ich Zeit. Gern!", "В пятницу у меня есть время. С удовольствием!"]
      questions:
        - q: "Как часто господин Вагнер ходит в кино?"
          options: ["Редко", "Часто", "Никогда"]
        - q: "Что господин Вагнер делает по средам?"
          options: ["Играет в карты", "Ходит в кино", "Смотрит телевизор"]
        - q: "Когда они пойдут в кино?"
