        exRu: "Это стоит пятьдесят центов."
      - de: "kosten"
        ru: "стоить"
        ex: "Der Kaffee kostet zwei Euro."
        exRu: "Кофе стоит два евро."
      - de: "billig"
        ru: "дешёвый"
        ex: "Das Handy ist billig."
        exRu: "Этот телефон дешёвый."
      - de: "teuer"
        ru: "дорогой"
        ex: "Berlin ist teuer."
        exRu: "Берлин дорогой."
      - de: "das Geld"
        ru: "деньги"
        ex: "Das Geld ist hier."
        exRu: "Деньги здесь."
      - de: "bezahlen"
        ru: "платить"
        ex: "Ich bezahle den Kaffee."
        exRu: "Я плачу за кофе."
      - de: "zusammen"
        ru: "вместе"
        ex: "Wir bezahlen zusammen."
        exRu: "Мы платим вместе."
      - de: "getrennt"
        ru: "раздельно"
        ex: "Bitte getrennt."
        exRu: "Раздельно, пожалуйста."
      - de: "die Kasse"
        ru: "касса"
        plural: "die Kassen"
        ex: "Die Kasse ist dort."
        exRu: "Касса там."
      - de: "die Münze"
        ru: "монета"
        plural: "die Münzen"
        ex: "Das ist eine Münze."
        exRu: "Это монета."
      - de: "der Geldschein"
        ru: "купюра"
        plural: "die Geldscheine"
        ex: "Ich habe nur einen Geldschein."
