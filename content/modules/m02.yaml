        - "О цене спрашивают [[Wie viel kostet das?]] Если предметов много, глагол меняется: [[Wie viel kosten die Brötchen?]]"
        - "Ответ: [[Das kostet drei Euro.]] На кассе часто говорят: [[Das macht zehn Euro.]] — то есть «с вас десять евро»."
