        - q: "Как спросить цену?"
          options: ["[[Wie viel kostet das?]]", "[[Wie alt ist das?]]", "[[Wie viele kostet das?]]", "[[Wo kostet das?]]", "[[Wer kostet das?]]"]
        - q: "Как правильно?"
          options: ["[[Das kostet zwanzig Euro.]]", "[[Das kostet zwanzig Euros.]]", "[[Das kosten zwanzig Euro.]]", "[[Das ist kostet zwanzig Euro.]]"]
        - q: "Что значит [[Das ist zu teuer]]?"
          options: ["Это слишком дорого", "Это очень дёшево", "Это бесплатно", "Это недорого"]
