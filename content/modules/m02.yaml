    grammar:
      title: "Глагол «иметь» и большие числа"
      explain:
        - "По-русски мы говорим «у меня есть», а по-немецки «я имею»: [[Ich habe zwanzig Euro.]] Это глагол [[haben]]."
        - "Формы глагола: [[ich habe]], [[er hat]], [[sie hat]], [[wir haben]], [[Sie haben]]. Про нескольких людей: [[sie haben]] — они имеют."
        - "С другом говорят [[du hast]], а группе друзей — [[ihr habt]]. Запомните особые формы без буквы [[b]]: [[du hast]] и [[er hat]]."
        - "Большие числа строятся просто: [[hundert]], [[zweihundert]], [[tausend]], [[dreitausend]]. Число сто двадцать: [[hundertzwanzig]]. Двести пятьдесят: [[zweihundertfünfzig]]."
        - "Слово [[Million]] — существительное, поэтому пишется с большой буквы и имеет множественное число: [[eine Million]], [[zwei Millionen]]."
      exercises:
        - q: "Как сказать «У меня есть время»?"
          options: ["[[Ich habe Zeit.]]", "[[Ich hat Zeit.]]", "[[Ich haben Zeit.]]", "[[Ich bin Zeit.]]", "[[Ich hast Zeit.]]"]
        - q: "Как правильно?"
          options: ["[[Er hat viel Geld.]]", "[[Er habt viel Geld.]]", "[[Er haben viel Geld.]]", "[[Er habe viel Geld.]]", "[[Er hast viel Geld.]]"]
        - q: "Как спросить «У вас достаточно денег?»"
          options: ["[[Haben Sie genug Geld?]]", "[[Sie haben genug Geld?]]", "[[Hat Sie genug Geld?]]", "[[Sind Sie genug Geld?]]"]
        - q: "Какое число [[zweihundertfünfzig]]?"
          options: ["Двести пятьдесят", "Двести пятнадцать", "Пятьсот двадцать", "Двадцать пять тысяч", "Две тысячи пятьсот"]
        - q: "Как по-немецки «три тысячи»?"
          options: ["[[dreitausend]]", "[[dreihundert]]", "[[drei Millionen]]", "[[dreizehn]]", "[[dreißig]]"]
        - q: "Как правильно?"
          options: ["[[Wir haben wenig Zeit.]]", "[[Wir hat wenig Zeit.]]", "[[Wir habe wenig Zeit.]]", "[[Wir hast wenig Zeit.]]", "[[Wir habt wenig Zeit.]]"]
