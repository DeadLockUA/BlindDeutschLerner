    grammar:
      title: "Глагол «быть» и вопрос без вопросительного слова"
      explain:
        - "В русском языке мы часто пропускаем глагол «быть»: «Я студент». В немецком его пропускать нельзя: [[Ich bin Student.]]"
        - "Глагол [[sein]] меняется по лицам: [[ich bin]], [[er ist]], [[sie ist]], [[wir sind]], [[Sie sind]]. Про нескольких людей говорят [[sie sind]] — они."
        - "С другом говорят [[du bist]] — ты есть, а группе друзей — [[ihr seid]], вы есть. Пока достаточно просто узнавать эти формы."
        - "Профессию называют без артикля: [[Ich bin Lehrer.]] [[Sie ist Studentin.]] Женская форма часто заканчивается на [[in]]: [[Lehrer]], [[Lehrerin]]."
        - "Вопрос без вопросительного слова начинается с глагола: [[Sind Sie Lehrer?]] [[Ist er verheiratet?]] Ответ: [[Ja]] или [[Nein]]."
      exercises:
        - q: "Как сказать «Я студент»?"
          options: ["[[Ich bin Student.]]", "[[Ich ist Student.]]", "[[Ich sind Student.]]", "[[Ich Student.]]", "[[Ich bin ein Student ist.]]"]
        - q: "Как правильно?"
          options: ["[[Wir sind verheiratet.]]", "[[Wir ist verheiratet.]]", "[[Wir bin verheiratet.]]", "[[Wir seid verheiratet.]]", "[[Wir bist verheiratet.]]"]
        - q: "Как спросить «Вы учительница?»"
          options: ["[[Sind Sie Lehrerin?]]", "[[Bin Sie Lehrerin?]]", "[[Ist Sie Lehrerin?]]", "[[Sind Lehrerin Sie?]]"]
        - q: "Как сказать «Он женат»?"
          options: ["[[Er ist verheiratet.]]", "[[Er sind verheiratet.]]", "[[Er bin verheiratet.]]", "[[Er ist ledig.]]"]
        - q: "Как будет «студентка»?"
          options: ["[[die Studentin]]", "[[der Student]]", "[[die Student]]", "[[die Lehrerin]]"]
        - q: "Какая форма значит «ты есть»?"
          options: ["[[du bist]]", "[[du ist]]", "[[du sind]]", "[[du seid]]"]
