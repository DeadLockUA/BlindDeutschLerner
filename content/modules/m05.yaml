        ru: "Для меня это слишком дорого."
      - de: "Kann ich die Wohnung sehen?"
        ru: "Можно посмотреть квартиру?"
    grammar:
      title: "Очень, слишком, довольно"
      explain:
        - "Прилагательное можно усилить или ослабить маленьким словом перед ним. Как в русском: «очень большой», «довольно большой», «слишком большой»."
        - "[[sehr]] — «очень»: [[Die Wohnung ist sehr hell.]] — «Квартира очень светлая». Это просто сильнее."
        - "[[ziemlich]] — «довольно»: [[Das Zimmer ist ziemlich klein.]] — «Комната довольно маленькая»."
        - "[[zu]] — «слишком». Это всегда значит, что что-то плохо, что это проблема: [[Die Wohnung ist zu teuer.]] — «Квартира слишком дорогая», то есть я её не сниму."
        - "Сравните: [[Die Wohnung ist sehr groß.]] — «очень большая», это хорошо. [[Die Wohnung ist zu groß.]] — «слишком большая», это мне не подходит."
      exercises:
        - q: "Как сказать «Квартира слишком дорогая»?"
          options: ["[[Die Wohnung ist zu teuer.]]", "[[Die Wohnung ist sehr teuer.]]", "[[Die Wohnung ist ziemlich teuer.]]", "[[Die Wohnung ist nicht teuer.]]", "[[Die Wohnung ist teuer zu.]]"]
        - q: "Что значит [[ziemlich hell]]?"
          options: ["Довольно светлый", "Очень светлый", "Слишком светлый", "Не светлый", "Тёмный"]
        - q: "Как сказать «Кухня очень современная»?"
          options: ["[[Die Küche ist sehr modern.]]", "[[Die Küche ist zu modern.]]", "[[Die Küche sehr ist modern.]]", "[[Die Küche ist ziemlich modern.]]"]
        - q: "Человек говорит: [[Das Zimmer ist zu klein.]] Что он имеет в виду?"
          options: ["Комната ему не подходит", "Комната ему очень нравится", "Комната большая", "Комната довольно уютная"]
        - q: "Противоположность слова [[hell]]?"
          options: ["[[dunkel]]", "[[laut]]", "[[neu]]", "[[modern]]", "[[gemütlich]]"]
        - q: "Противоположность слова [[laut]]?"
          options: ["[[leise]]", "[[hell]]", "[[sehr]]", "[[dunkel]]"]
    dialogue:
      title: "Осмотр квартиры"
      speakers: {A: f, B: m}
      lines:
        - [A, "Guten Tag, Herr Müller. Ist die Wohnung noch frei?", "Добрый день, господин Мюллер. Квартира ещё свободна?"]
        - [B, "Ja, sie ist frei. Sie ist hell und ziemlich ruhig.", "Да, свободна. Она светлая и довольно тихая."]
        - [A, "Wie groß ist die Wohnung?", "Какая площадь квартиры?"]
        - [B, "Siebzig Quadratmeter, drei Zimmer und eine moderne Küche.", "Семьдесят квадратных метров, три комнаты и современная кухня."]
        - [A, "Und wie hoch ist die Miete?", "А какая арендная плата?"]
        - [B, "Achthundert Euro, plus hundertfünfzig Euro Nebenkosten.", "Восемьсот евро плюс сто пятьдесят евро коммунальные платежи."]
        - [A, "Hm, das ist mir ein bisschen zu teuer.", "Хм, для меня это немного дороговато."]
        - [B, "Aber die Wohnung ist sehr schön. Kommen Sie, sehen Sie mal!", "Но квартира очень красивая. Пойдёмте, посмотрите!"]
      questions:
        - q: "Какая площадь квартиры?"
          options: ["Семьдесят квадратных метров", "Семнадцать квадратных метров", "Восемьдесят квадратных метров", "Сто пятьдесят квадратных метров"]
        - q: "Сколько стоит аренда без коммунальных платежей?"
          options: ["Восемьсот евро", "Сто пятьдесят евро", "Семьсот евро", "Девятьсот пятьдесят евро"]
        - q: "Что думает женщина о цене?"
          options: ["Немного дорого", "Очень дёшево", "Нормально", "Она не говорит"]

  - id: m05l05
    title: "Домашние дела"
    intro: "В этом уроке вы научитесь говорить об уборке и домашних делах и познакомитесь с глаголами, которые разделяются на части."
    words:
      - de: "putzen"
        ru: "убирать, чистить"
        ex: "Am Samstag putze ich die Wohnung."
        exRu: "В субботу я убираю квартиру."
      - de: "waschen"
        ru: "стирать, мыть"
        ex: "Ich wasche heute die Wäsche."
        exRu: "Сегодня я стираю бельё."
      - de: "aufräumen"
        ru: "наводить порядок"
        ex: "Die Kinder räumen das Zimmer auf."
        exRu: "Дети наводят порядок в комнате."
      - de: "spülen"
        ru: "мыть посуду"
        ex: "Nach dem Essen spüle ich."
        exRu: "После еды я мою посуду."
      - de: "das Geschirr"
        ru: "посуда"
        ex: "Das Geschirr ist sauber."
        exRu: "Посуда чистая."
      - de: "der Müll"
        ru: "мусор"
        ex: "Der Müll ist in der Küche."
        exRu: "Мусор на кухне."
      - de: "die Waschmaschine"
        ru: "стиральная машина"
        plural: "die Waschmaschinen"
        ex: "Die Waschmaschine ist im Bad."
        exRu: "Стиральная машина в ванной."
      - de: "der Kühlschrank"
        ru: "холодильник"
        plural: "die Kühlschränke"
        ex: "Die Milch ist im Kühlschrank."
        exRu: "Молоко в холодильнике."
      - de: "der Herd"
        ru: "плита"
        plural: "die Herde"
        ex: "Die Suppe steht auf dem Herd."
        exRu: "Суп стоит на плите."
      - de: "helfen"
        ru: "помогать"
        ex: "Mein Sohn hilft mir."
        exRu: "Мой сын мне помогает."
      - de: "sauber"
        ru: "чистый"
        ex: "Die Küche ist jetzt sauber."
        exRu: "Кухня теперь чистая."
      - de: "schmutzig"
        ru: "грязный"
        ex: "Der Teppich ist schmutzig."
        exRu: "Ковёр грязный."
    phrases:
      - de: "den Müll rausbringen"
        ru: "выносить мусор"
      - de: "die Wäsche waschen"
        ru: "стирать бельё"
      - de: "Können Sie mir helfen?"
        ru: "Вы можете мне помочь?"
      - de: "Kein Problem!"
        ru: "Без проблем!"
      - de: "Das mache ich."
        ru: "Это сделаю я."
    grammar:
      title: "Глаголы с отделяемой приставкой"
      explain:
        - "В немецком есть глаголы, которые в предложении разделяются на две части. Например, [[aufräumen]] — «наводить порядок». Приставка здесь [[auf]]."
        - "Основная часть глагола стоит на втором месте, а приставка уходит в самый конец предложения: [[Ich räume auf.]] — «Я навожу порядок»."
        - "Если есть другие слова, приставка всё равно в конце: [[Ich räume das Zimmer auf.]] [[Peter räumt heute die Küche auf.]]"
        - "Так же работает [[rausbringen]] — «выносить»: [[Ich bringe den Müll raus.]] — «Я выношу мусор». И [[aufmachen]]: [[Ich mache das Fenster auf.]]"
        - "Совет: услышали в начале глагол, например [[räume]], ждите конца предложения. Там может быть приставка, и она важна для смысла."
      exercises:
        - q: "Как сказать «Я навожу порядок в комнате»?"
          options: ["[[Ich räume das Zimmer auf.]]", "[[Ich aufräume das Zimmer.]]", "[[Ich räume auf das Zimmer.]]", "[[Ich auf räume das Zimmer.]]", "[[Ich das Zimmer aufräume.]]"]
        - q: "Как сказать «Я выношу мусор»?"
          options: ["[[Ich bringe den Müll raus.]]", "[[Ich rausbringe den Müll.]]", "[[Ich bringe raus den Müll.]]", "[[Ich den Müll rausbringe.]]"]
        - q: "[[Thomas ... die Küche auf.]] Какое слово пропущено?"
          options: ["[[räumt]]", "[[aufräumt]]", "[[räumen]]", "[[räume]]", "[[aufräumen]]"]
        - q: "Где стоит приставка [[auf]] в предложении [[Ich mache das Fenster auf]]?"
          options: ["В конце предложения", "В начале предложения", "Перед глаголом", "После местоимения"]
        - q: "Что значит [[Wir räumen heute auf.]]?"
          options: ["Сегодня мы наводим порядок", "Сегодня мы моем посуду", "Сегодня мы выносим мусор", "Сегодня мы стираем", "Сегодня мы готовим"]
    dialogue:
      title: "Уборка в субботу"
      speakers: {A: f, B: m}
      lines:
        - [A, "Lukas, heute ist Samstag. Wir putzen die Wohnung.", "Лукас, сегодня суббота. Мы убираем квартиру."]
        - [B, "Okay. Was mache ich?", "Ладно. Что делаю я?"]
        - [A, "Räumen Sie bitte das Wohnzimmer auf.", "Пожалуйста, наведите порядок в гостиной."]
        - [B, "Kein Problem. Und der Müll? Das mache ich auch.", "Без проблем. А мусор? Это я тоже сделаю."]
        - [A, "Danke! Ich spüle das Geschirr und wasche die Wäsche.", "Спасибо! Я помою посуду и постираю бельё."]
        - [B, "Der Kühlschrank ist auch schmutzig.", "Холодильник тоже грязный."]
        - [A, "Oh ja. Können Sie mir später helfen?", "О да. Вы можете мне потом помочь?"]
        - [B, "Natürlich!", "Конечно!"]
      questions:
        - q: "Что должен сделать Лукас?"
          options: ["Навести порядок в гостиной и вынести мусор", "Помыть посуду", "Постирать бельё", "Почистить плиту"]
        - q: "Что ещё грязное?"
          options: ["Холодильник", "Ковёр", "Окно", "Плита"]
        - q: "Какой сегодня день?"
          options: ["Суббота", "Воскресенье", "Понедельник"]
