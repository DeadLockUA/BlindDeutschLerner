    grammar:
      title: "Перфект: прошедшее время в разговоре"
      explain:
        - "В разговоре о прошлом немцы чаще всего используют перфект. Он состоит из двух частей: [[haben]] или [[sein]] плюс особая форма глагола, причастие."
        - "Причастие обычно начинается на [[ge]]: [[machen]] — [[gemacht]], [[kaufen]] — [[gekauft]], [[essen]] — [[gegessen]], [[trinken]] — [[getrunken]]."
        - "[[Haben]] стоит на втором месте, а причастие — в самом конце: [[Ich habe gestern Brot gekauft.]] — Вчера я купил хлеб."
        - "Большинство глаголов берут [[haben]]. Но глаголы движения берут [[sein]]: [[Ich bin nach Hause gegangen.]] [[Wir sind nach Berlin gefahren.]] [[Er ist spät gekommen.]]"
        - "В вопросе [[haben]] или [[sein]] ставят на первое место: [[Haben Sie schon gegessen?]] — Вы уже поели? [[Sind Sie mit dem Bus gefahren?]] — Вы ехали на автобусе?"
      exercises:
        - q: "Как сказать «Я купил хлеб»?"
          options: ["[[Ich habe Brot gekauft.]]", "[[Ich bin Brot gekauft.]]", "[[Ich habe gekauft Brot.]]", "[[Ich habe Brot kaufen.]]", "[[Ich gekauft Brot habe.]]"]
        - q: "Какой глагол нужен: [[Wir ... nach Hamburg gefahren.]]"
          options: ["[[sind]]", "[[haben]]", "[[hat]]", "[[ist]]", "[[seid]]"]
        - q: "Какой глагол нужен: [[Er ... Kaffee getrunken.]]"
          options: ["[[hat]]", "[[ist]]", "[[habe]]", "[[sind]]", "[[haben]]"]
        - q: "Как правильно?"
          options: ["[[Ich bin ins Kino gegangen.]]", "[[Ich habe ins Kino gegangen.]]", "[[Ich bin ins Kino gegeht.]]", "[[Ich bin gegangen ins Kino.]]", "[[Ich ins Kino bin gegangen.]]"]
        - q: "Какое причастие у глагола [[sehen]]?"
          options: ["[[gesehen]]", "[[gesieht]]", "[[gesehnt]]", "[[gesah]]", "[[sehengt]]"]
        - q: "Как спросить «Вы хорошо спали?»"
          options: ["[[Haben Sie gut geschlafen?]]", "[[Sind Sie gut geschlafen?]]", "[[Haben Sie gut schlafen?]]", "[[Sie haben gut geschlafen?]]", "[[Haben geschlafen Sie gut?]]"]
